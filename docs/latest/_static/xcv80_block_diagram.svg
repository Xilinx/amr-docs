<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <style>
      .main-fpga { fill: #E8EDF2; stroke: #2C3E50; stroke-width: 2.5; rx: 10; }
      .block { fill: #F0F4F8; stroke: #4A6785; stroke-width: 1.5; rx: 5; }
      .block-accent { fill: #D6E4F0; stroke: #2C5F8A; stroke-width: 1.5; rx: 5; }
      .block-dark { fill: #DCE3EA; stroke: #34495E; stroke-width: 1.5; rx: 5; }
      .label { font-size: 12px; fill: #1A1A1A; text-anchor: middle; font-weight: bold; }
      .label-sm { font-size: 10px; fill: #444; text-anchor: middle; }
      .label-lg { font-size: 18px; fill: #1A1A1A; text-anchor: middle; font-weight: bold; }
      .bus-label { font-size: 9px; fill: #555; text-anchor: middle; font-weight: 600; }
      .conn { fill: none; stroke: #4A4A4A; stroke-width: 1.5; }
      .conn-thick { fill: none; stroke: #333; stroke-width: 2; }
      .title { font-size: 20px; fill: #111; text-anchor: middle; font-weight: bold; letter-spacing: 1px; }
    </style>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A4A4A"/>
    </marker>
    <marker id="aL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#4A4A4A"/>
    </marker>
    <marker id="aD" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,0 L3,8 L6,0 Z" fill="#4A4A4A"/>
    </marker>
    <marker id="aU" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L3,0 L6,8 Z" fill="#4A4A4A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="#FFFFFF" rx="10"/>

  <!-- Title -->
  <text x="550" y="32" class="title">XCV80 System Block Diagram</text>
  <line x1="300" y1="42" x2="800" y2="42" stroke="#CCC" stroke-width="1"/>

  <!-- ===================== XCV80 MAIN FPGA (Center) ===================== -->
  <rect x="230" y="130" width="400" height="310" class="main-fpga"/>
  <text x="430" y="290" class="label-lg">XCV80</text>

  <!-- ===================== TOP: Memory & IO ===================== -->
  <rect x="195" y="58" width="100" height="42" class="block-accent"/>
  <text x="245" y="76" class="label">DDR4</text>
  <text x="245" y="90" class="label-sm">4 GB</text>
  <line x1="245" y1="100" x2="245" y2="128" class="conn" marker-end="url(#aD)" marker-start="url(#aU)"/>

  <rect x="315" y="58" width="80" height="42" class="block-accent"/>
  <text x="355" y="84" class="label">DIMM</text>
  <line x1="355" y1="100" x2="355" y2="128" class="conn" marker-end="url(#aD)" marker-start="url(#aU)"/>

  <rect x="415" y="58" width="80" height="42" class="block"/>
  <text x="455" y="76" class="label">MCIO</text>
  <text x="455" y="90" class="label-sm">x4</text>
  <line x1="455" y1="100" x2="455" y2="128" class="conn" marker-end="url(#aD)" marker-start="url(#aU)"/>

  <rect x="510" y="58" width="80" height="42" class="block"/>
  <text x="550" y="76" class="label">MCIO</text>
  <text x="550" y="90" class="label-sm">x8</text>
  <line x1="550" y1="100" x2="550" y2="128" class="conn" marker-end="url(#aD)" marker-start="url(#aU)"/>

  <rect x="605" y="58" width="80" height="42" class="block"/>
  <text x="645" y="76" class="label">MCIO</text>
  <text x="645" y="90" class="label-sm">x4</text>
  <line x1="645" y1="100" x2="645" y2="128" class="conn" marker-end="url(#aD)" marker-start="url(#aU)"/>

  <!-- ===================== TOP-RIGHT: Power ===================== -->
  <rect x="960" y="58" width="90" height="42" class="block-dark"/>
  <text x="1005" y="76" class="label">AUX1</text>
  <text x="1005" y="90" class="label-sm">2x4</text>
  <line x1="958" y1="79" x2="900" y2="79" class="conn" marker-end="url(#aL)"/>
  <text x="930" y="72" class="bus-label">12V</text>
  <line x1="900" y1="79" x2="900" y2="130" class="conn" marker-end="url(#aD)"/>

  <rect x="960" y="115" width="90" height="42" class="block-dark"/>
  <text x="1005" y="133" class="label">AUX2</text>
  <text x="1005" y="147" class="label-sm">2x4</text>
  <line x1="958" y1="136" x2="900" y2="136" class="conn" marker-end="url(#aL)"/>
  <text x="930" y="129" class="bus-label">12V</text>

  <!-- ===================== LEFT: QSFP Ports ===================== -->
  <rect x="20" y="115" width="130" height="36" class="block-accent"/>
  <text x="85" y="137" class="label">QSFP Sideband</text>
  <line x1="150" y1="133" x2="180" y2="133" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>
  <line x1="180" y1="133" x2="180" y2="150" class="conn"/>
  <line x1="180" y1="150" x2="228" y2="150" class="conn" marker-end="url(#aR)"/>

  <rect x="20" y="170" width="130" height="36" class="block-accent"/>
  <text x="85" y="192" class="label">QSFP56 Port 1</text>
  <line x1="150" y1="188" x2="228" y2="188" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <rect x="20" y="220" width="130" height="36" class="block-accent"/>
  <text x="85" y="242" class="label">QSFP56 Port 2</text>
  <line x1="150" y1="238" x2="228" y2="238" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <rect x="20" y="270" width="130" height="36" class="block-accent"/>
  <text x="85" y="292" class="label">QSFP56 Port 3</text>
  <line x1="150" y1="288" x2="228" y2="288" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <rect x="20" y="320" width="130" height="36" class="block-accent"/>
  <text x="85" y="342" class="label">QSFP56 Port 4</text>
  <line x1="150" y1="338" x2="228" y2="338" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <!-- ===================== RIGHT: Storage & Sensors ===================== -->
  <rect x="710" y="165" width="130" height="40" class="block"/>
  <text x="775" y="189" class="label">eMMC</text>
  <line x1="632" y1="185" x2="708" y2="185" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <rect x="710" y="225" width="130" height="40" class="block"/>
  <text x="775" y="249" class="label">Log Flash</text>
  <line x1="632" y1="245" x2="708" y2="245" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <rect x="710" y="285" width="130" height="40" class="block"/>
  <text x="775" y="309" class="label">Card Sensors</text>
  <line x1="632" y1="305" x2="708" y2="305" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <rect x="710" y="345" width="130" height="44" class="block"/>
  <text x="775" y="364" class="label">Config OSPI</text>
  <text x="775" y="379" class="label-sm">Flash 2Gbit</text>
  <line x1="632" y1="367" x2="708" y2="367" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <!-- ===================== BOTTOM: PCIe, IPMI, USB ===================== -->
  <rect x="280" y="510" width="260" height="44" class="block-accent"/>
  <text x="410" y="536" class="label">PCIe x16</text>
  <line x1="410" y1="442" x2="410" y2="508" class="conn-thick" marker-end="url(#aD)" marker-start="url(#aU)"/>

  <rect x="710" y="475" width="130" height="40" class="block"/>
  <text x="775" y="499" class="label">IPMI EEPROM</text>
  <line x1="632" y1="430" x2="670" y2="430" class="conn"/>
  <line x1="670" y1="430" x2="670" y2="495" class="conn"/>
  <line x1="670" y1="495" x2="708" y2="495" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

  <rect x="710" y="535" width="130" height="40" class="block"/>
  <text x="775" y="553" class="label">USB /</text>
  <text x="775" y="567" class="label">ADK2</text>
  <line x1="542" y1="532" x2="600" y2="532" class="conn"/>
  <line x1="600" y1="532" x2="600" y2="555" class="conn"/>
  <line x1="600" y1="555" x2="708" y2="555" class="conn" marker-end="url(#aR)" marker-start="url(#aL)"/>

</svg>
